# Disposable local test environment. No production data or credentials.
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
      MARIADB_DATABASE: snow3
      MARIADB_USER: snow3
      MARIADB_PASSWORD: snow3-local-only
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      retries: 30
    volumes:
      - db:/var/lib/mysql
  wordpress:
    image: wordpress:7.1.3-php8.2-apache
    ports:
      - '127.0.0.1:18083:80'
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: snow3
      WORDPRESS_DB_PASSWORD: snow3-local-only
      WORDPRESS_DB_NAME: snow3
      WORDPRESS_DEBUG: '1'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - wordpress:/var/www/html
      - .:/var/www/html/wp-content/plugins/Snow3:ro
volumes:
  db:
  wordpress:
